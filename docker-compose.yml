services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spend
      POSTGRES_USER: spend
      POSTGRES_PASSWORD: spend
    ports:
      - "5432:5432"
    volumes:
      - spend_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spend -d spend"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spend_postgres:
